spring:
  task:
    execution:
      # Keep Boot's applicationTaskExecutor even though OrgSyncConfig declares its own Executor bean.
      mode: force
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emitkit}
    username: ${SPRING_DATASOURCE_USERNAME:emitkit}
    password: ${SPRING_DATASOURCE_PASSWORD:emitkit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    data:
      redis:
        namespace: emitkit
  ai:
    model:
      chat: none
  security:
    oauth2:
      client:
        registration:
          # The client id and secret come from the environment (SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_
          # GITHUB_CLIENT_ID and _SECRET); startup fails without them.
          github:
            scope: repo,read:org,workflow,user:email,write:repo_hook
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
emitkit:
  web:
    base-url: http://localhost:5173
springdoc:
  default-produces-media-type: application/json
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
logging:
  pattern:
    level: "%5p [%X{runId:-},%X{orgId:-}]"
