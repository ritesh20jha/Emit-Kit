spring:
  rabbitmq:
    username: ${SPRING_RABBITMQ_USERNAME:emitkit}
    password: ${SPRING_RABBITMQ_PASSWORD:emitkit}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: ${emitkit.worker.concurrency}
  ai:
    model:
      chat: none
emitkit:
  worker:
    concurrency: 4
    retry-ttls: 10s,60s,300s
