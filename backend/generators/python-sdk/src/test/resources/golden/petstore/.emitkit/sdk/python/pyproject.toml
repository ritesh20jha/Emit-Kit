[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-pets"
version = "1.2.3"
description = "Python client for the Petstore API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["acme_pets"]
