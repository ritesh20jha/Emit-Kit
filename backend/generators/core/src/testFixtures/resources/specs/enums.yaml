openapi: 3.0.3
info:
  title: Enums
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - {name: color, in: query, schema: {$ref: '#/components/schemas/Color'}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Item'}
components:
  schemas:
    Color:
      type: string
      enum: [red, green, blue]
    Priority:
      type: integer
      enum: [1, 2, 3]
    Item:
      type: object
      properties:
        color: {$ref: '#/components/schemas/Color'}
        priority: {$ref: '#/components/schemas/Priority'}
        size:
          type: string
          enum: [small, large]
