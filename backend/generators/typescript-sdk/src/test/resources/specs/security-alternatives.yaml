openapi: 3.1.0
info:
  title: Security Alternatives
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
tags:
  - name: items
paths:
  /items:
    get:
      operationId: listItems
      tags: [items]
      security:
        - headerKey: []
        - queryKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: limit
          in: header
          schema:
            type: integer
        - name: Authorization
          in: header
          schema:
            type: string
        - name: Accept
          in: header
          schema:
            type: string
        - name: content-type
          in: header
          schema:
            type: string
      responses:
        '200':
          description: ok
  /things/{xId}:
    get:
      operationId: getThing
      tags: [items]
      security:
        - cookieKey: []
        - queryKey: []
      parameters:
        - name: xId
          in: path
          required: true
          schema:
            type: string
        - name: X-Id
          in: header
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: ok
  /legacy:
    get:
      operationId: legacyCall
      tags: [items]
      security:
        - queryKey: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    headerKey:
      type: apiKey
      in: header
      name: X-Api-Key
    queryKey:
      type: apiKey
      in: query
      name: api_key
    cookieKey:
      type: apiKey
      in: cookie
      name: sid
