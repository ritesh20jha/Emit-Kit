name: "Publish Pets TypeScript SDK"

on:
  push:
    tags:
      - 'sdk/v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ".emitkit/sdk/typescript"
        run: npm ci

      - name: Build
        working-directory: ".emitkit/sdk/typescript"
        run: npm run build

      - name: Publish
        working-directory: ".emitkit/sdk/typescript"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
