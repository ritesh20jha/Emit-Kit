[versions]
spring-boot = "4.1.2"
archunit = "1.5.1"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
aws-sdk = "2.57.8"
spotless = "8.10.4"
google-java-format = "2.0.0"
ulid-creator = "5.2.3"
springdoc = "3.1.1"
spring-vault = "4.1.1"
swagger-parser = "2.1.48"
jmustache = "1.16"
java-diff-utils = "4.17"
spring-ai = "2.0.2"
kohsuke-github-api = "1.330"
okhttp = "4.12.0"
wiremock = "3.13.2"
docker-java = "3.7.1"
commons-compress = "1.28.0"
java-semver = "0.10.2"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-core = { module = "org.springframework.boot:spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-vault = { module = "org.testcontainers:testcontainers-vault" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jspecify = { module = "org.jspecify:jspecify" }
ulid-creator = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid-creator" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-session-data-redis = { module = "org.springframework.boot:spring-boot-starter-session-data-redis" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-data-redis = { module = "org.springframework.data:spring-data-redis" }
lettuce-core = { module = "io.lettuce:lettuce-core" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
spring-vault-core = { module = "org.springframework.vault:spring-vault-core", version.ref = "spring-vault" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }
snakeyaml = { module = "org.yaml:snakeyaml" }
jmustache = { module = "com.samskivert:jmustache", version.ref = "jmustache" }
java-diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "java-diff-utils" }
# Spring Vault needs Jackson on the classpath for its JSON bodies (optional there). Boot 4 manages Jackson 3.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
spring-ai-client-chat = { module = "org.springframework.ai:spring-ai-client-chat" }
spring-ai-google-genai = { module = "org.springframework.ai:spring-ai-google-genai" }
kohsuke-github-api = { module = "org.kohsuke:github-api", version.ref = "kohsuke-github-api" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "docker-java" }
docker-java-transport-httpclient5 = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "docker-java" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
java-semver = { module = "com.github.zafarkhaja:java-semver", version.ref = "java-semver" }
