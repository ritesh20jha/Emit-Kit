swagger: "2.0"
info:
  title: Petstore
  version: "1.0.0"
host: petstore.example.com
basePath: /v1
schemes:
  - https
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags:
        - pets
      produces:
        - application/json
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              type: string
    post:
      operationId: createPet
      tags:
        - pets
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      operationId: getPet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: A pet
