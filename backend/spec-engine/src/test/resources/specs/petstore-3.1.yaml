openapi: 3.1.0
info: {title: Petstore, version: 1.0.0}
paths:
  /pets:
    get: {operationId: listPets, responses: {"200": {description: A list of pets}}}
    post: {operationId: createPet, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {"201": {description: Created}}}
  /pets/{petId}:
    get: {operationId: getPet, parameters: [{name: petId, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: A pet}}}
