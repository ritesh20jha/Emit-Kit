name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/export-openapi.sh'
      - 'frontend/openapi.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/lib/api/generated/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/export-openapi.sh'
      - 'frontend/openapi.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/lib/api/generated/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The sandbox ITs run under gVisor (spec 5.6). Pinned release, checksum verified.
      - name: Install gVisor runsc
        run: |
          base=https://storage.googleapis.com/gvisor/releases/release/20261102.0/x86_64
          cd "$RUNNER_TEMP"
          curl -fsSL -O "$base/runsc" -O "$base/runsc.sha512"
          sha512sum -c runsc.sha512
          sudo install -m 0755 runsc /usr/local/bin/runsc
          sudo runsc install
          sudo systemctl restart docker
          timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
          docker info --format '{{json .Runtimes}}'

      - name: Build
        working-directory: backend
        run: ./gradlew build -Dsandbox.runtime=runsc

      # Runs after ./gradlew build. The build's snapshot test already fails on a stale openapi.json, so
      # this step adds the generated client and reports any drift as a readable failure.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI
        run: scripts/export-openapi.sh

      - name: Generate API client
        working-directory: frontend
        run: pnpm gen:api

      # `git status --porcelain` also reports new, untracked files that `git diff` would miss.
      - name: Check committed contract is current
        run: |
          changes="$(git status --porcelain -- frontend/openapi.json frontend/src/lib/api/generated)"
          if [ -n "$changes" ]; then
            echo "::error::frontend/openapi.json or the generated API client is out of date."
            echo "Run scripts/export-openapi.sh and (cd frontend && pnpm gen:api), then commit the result."
            echo "$changes"
            git --no-pager diff -- frontend/openapi.json frontend/src/lib/api/generated
            exit 1
          fi
