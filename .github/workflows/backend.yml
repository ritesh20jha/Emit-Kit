name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/export-openapi.sh'
      - 'frontend/openapi.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/lib/api/generated/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/export-openapi.sh'
      - 'frontend/openapi.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/lib/api/generated/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The sandbox ITs run under gVisor (spec 5.6). gVisor's apt repo keeps only the newest runsc, so
      # a pinned `apt-get install runsc=<version>` breaks at the next release. The pinned .deb stays in
      # the repo's pool, so it is downloaded directly and checked against a recorded sha256. To bump:
      # change both values (sha256sum of https://storage.googleapis.com/gvisor/releases/pool/<version>/binary-amd64/runsc.deb).
      - name: Install gVisor runsc
        env:
          RUNSC_VERSION: '20261102.0'
          RUNSC_SHA256: 81e3ecc4bb0d3eb321f5cf357e97a26daea91c6dc70ec30c9240cd481e6cf2da
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runsc.deb" "https://storage.googleapis.com/gvisor/releases/pool/${RUNSC_VERSION}/binary-amd64/runsc.deb"
          echo "${RUNSC_SHA256}  $RUNNER_TEMP/runsc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/runsc.deb"
          sudo runsc install
          sudo systemctl restart docker
          timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
          docker info --format '{{json .Runtimes}}'

      - name: Build
        working-directory: backend
        run: ./gradlew build -Dsandbox.runtime=runsc

      # Runs after ./gradlew build. The build's snapshot test already fails on a stale openapi.json, so
      # this step adds the generated client and reports any drift as a readable failure.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI
        run: scripts/export-openapi.sh

      - name: Generate API client
        working-directory: frontend
        run: pnpm gen:api

      # `git status --porcelain` also reports new, untracked files that `git diff` would miss.
      - name: Check committed contract is current
        run: |
          changes="$(git status --porcelain -- frontend/openapi.json frontend/src/lib/api/generated)"
          if [ -n "$changes" ]; then
            echo "::error::frontend/openapi.json or the generated API client is out of date."
            echo "Run scripts/export-openapi.sh and (cd frontend && pnpm gen:api), then commit the result."
            echo "$changes"
            git --no-pager diff -- frontend/openapi.json frontend/src/lib/api/generated
            exit 1
          fi
