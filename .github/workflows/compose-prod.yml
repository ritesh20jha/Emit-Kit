name: Compose prod

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/compose-prod.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/compose-prod.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f deploy/compose/docker-compose.prod.yml --env-file deploy/compose/.env.prod.example config -q

      # Builds the images, brings the stack up with a test overlay and checks the edge.
      # smoke.sh prints container logs and tears the stack down, also on failure.
      - name: Smoke test
        run: bash deploy/compose/smoke.sh
