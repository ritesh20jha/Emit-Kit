name: Compose prod

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/restore-drill.sh"
      - ".github/workflows/compose-prod.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/restore-drill.sh"
      - ".github/workflows/compose-prod.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The example has empty secrets on purpose, so validate a generated env file, not the example.
      - name: Validate production compose file
        run: |
          bash deploy/compose/gen-env.sh > "$RUNNER_TEMP/prod.env"
          docker compose -f deploy/compose/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" config -q

      # Builds the images, brings the stack up with a test overlay and checks the edge.
      # smoke.sh prints container logs and tears the stack down, also on failure.
      - name: Smoke test
        run: bash deploy/compose/smoke.sh

  # Backups restore: seeds a source stack, backs it up off-host, restores into a fresh stack and checks that a
  # stored webhook secret still decrypts. Throwaway secrets only. The script removes all its stacks and volumes,
  # also on failure. Separate job so that it has its own time limit (it builds the api image).
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restore drill
        run: bash scripts/restore-drill.sh
