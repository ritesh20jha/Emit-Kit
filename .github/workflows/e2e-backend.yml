name: E2E Backend

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, docs/java-rebuild-specs]
    paths:
      - 'backend/**'
      - 'deploy/docker/toolchain/**'
      - '.github/workflows/e2e-backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build toolchain image
        run: docker build -t emitkit/toolchain:test deploy/docker/toolchain

      # required=true: a missing image or runtime fails the job instead of skipping the test.
      - name: Run pipeline end-to-end test
        working-directory: backend
        run: >-
          ./gradlew :worker-app:test --tests '*WRK12PipelineE2EIT*'
          -De2e.required=true
          -Dsandbox.runtime=runc

      - name: Upload Gradle test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-test-reports
          path: backend/worker-app/build/reports/tests
          if-no-files-found: ignore
