name: Security

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  push:
    branches: [main, docs/java-rebuild-specs]
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  workflow_dispatch:
  schedule:
    # Weekly, so a CVE published between pushes still surfaces. Scheduled runs use the default
    # branch only, so this takes effect once the workflow is on main.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Keyless cold NVD downloads are rate-limited and slow. The NVD cache keeps later runs short.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The NVD feed is large and the first download is slow. The key is per run, so each run saves
      # the refreshed data and the next run restores the newest copy. Restore and save are separate
      # so the save runs even when the scan fails on a CVSS 7.0+ finding (see backend/build.gradle.kts).
      - name: Restore NVD data
        uses: actions/cache/restore@v4
        with:
          path: backend/build/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # Fork and Dependabot PRs get no secrets, so NVD_API_KEY is empty there. The scan still runs
      # without a key, which is slower and rate-limited. The gate is never skipped for that reason.
      - name: OWASP dependency-check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate

      # Saved only on push and schedule, never on PRs (PRs just restore). !cancelled() still saves
      # after a failed scan, but not after a cancelled job, which can leave H2 mid-write.
      - name: Save NVD data
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: backend/build/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
