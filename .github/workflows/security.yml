name: Security

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  push:
    branches: [main, docs/java-rebuild-specs]
    paths:
      - 'backend/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  workflow_dispatch:
  schedule:
    # Weekly, so a CVE published between pushes still surfaces. Scheduled runs use the default
    # branch only, so this takes effect once the workflow is on main.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Nothing is cached, so every run downloads the NVD feed. Keyless that is rate-limited and slow.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Fork and Dependabot PRs get no secrets, so NVD_API_KEY is empty there. The scan still runs
      # without a key, which is slower and rate-limited. The gate is never skipped for that reason.
      - name: OWASP dependency-check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
