# Baseline lint policy for generated code, pinned in the image. Ruff's built-in default rule set
# (UP, FA, PYI and more) is a style policy that changes with the ruff version. The compile layer
# only checks correctness, so the rules here are ruff's classic correctness defaults. A project's
# own [tool.ruff] or ruff.toml takes precedence over this file.
[lint]
select = ["E4", "E7", "E9", "F"]
