# Local development stack. Credentials here are dev-only defaults; override them in .env (see .env.example).
name: emitkit-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emitkit}
      POSTGRES_USER: ${POSTGRES_USER:-emitkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emitkit}
    ports:
      - "127.0.0.1:5432:5432"
    # Postgres 18+ images keep PGDATA under a version-specific subdirectory of /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-emitkit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-emitkit}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-emitkit}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-emitkit-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rustfs-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-emitkit}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-emitkit-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-emitkit-artifacts}
    # Stays running after success so `up --wait` (which fails on exited containers) can pass.
    # The healthcheck flips to healthy once the bucket step has succeeded.
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 ||
        aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET") &&
        touch /tmp/ready && exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  vault:
    image: hashicorp/vault:2.2.1
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:-dev-root}", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  vault-init:
    image: hashicorp/vault:2.2.1
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root}
    # The lifecycle keepalive belongs in compose, not in init.sh: init.sh only does the work.
    # Stays running after success so `up --wait` can pass (see rustfs-init).
    # ./.secrets is created root:root when Docker bind-mounts it. Task 2's init.sh must
    # chmod 777 /secrets and chmod 644 each file it writes (dev only).
    init: true
    entrypoint: ["/bin/sh", "-c", "/bin/sh /init.sh && touch /tmp/ready && exec sleep infinity"]
    volumes:
      - ./vault/init.sh:/init.sh:ro
      - ./.secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  rustfs-data:
