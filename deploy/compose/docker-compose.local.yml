# Local overlay for local-prod.sh only. Never use it in production.
# Used with docker-compose.prod.yml and docker-compose.smoke.yml. GitHub is the real one: the OAuth client comes from
# the env file, and the worker runs the real pipeline against the host's sandbox daemon.
# The smoke overlay hardcodes ./smoke-secrets, so the secret files and the vault-init mount are repointed to
# ./local-secrets (the scratch dir local-prod.sh writes).
services:
  vault-init:
    volumes: !override
      - ./vault/init.sh:/init.sh:ro
      - ./vault/policies:/policies:ro
      - ./local-secrets:/secrets

  api:
    environment:
      # Where GitHub sends webhooks. https://localhost cannot be reached by GitHub; set LOCAL_PUBLIC_URL to a tunnel
      # URL for push-triggered runs (manual runs work without it).
      EMITKIT_PUBLIC_URL: ${LOCAL_PUBLIC_URL:-https://localhost}

  worker:
    environment:
      EMITKIT_WORKER_PIPELINE_ENABLED: "true"
      EMITKIT_SANDBOX_IMAGE: ${LOCAL_TOOLCHAIN_IMAGE:-emitkit/toolchain:test}
      EMITKIT_SANDBOX_RUNTIME: runc
    # The real sandbox daemon socket (LOCAL_SANDBOX_SOCKET), replacing the smoke overlay's placeholder file.
    volumes: !override
      - ${LOCAL_SANDBOX_SOCKET:-/run/emitkit-sandbox/docker.sock}:/run/emitkit-sandbox/docker.sock

secrets:
  api_vault_secret_id:
    file: ./local-secrets/api-secret-id
  worker_vault_secret_id:
    file: ./local-secrets/worker-secret-id
  backup_vault_secret_id:
    file: ./local-secrets/backup-secret-id
